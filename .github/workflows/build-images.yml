name: Build Images

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref (commit SHA) to check out and build
        type: string
        default: ""
      image:
        description: Image repository, e.g. ghcr.io/owner/repo
        type: string
        required: true
      tag:
        description: Tag suffix applied to the pushed images
        type: string
        required: true
      best-effort-push:
        description: Do not fail the build when pushing fails (fork tokens may lack package write access)
        type: boolean
        default: false
      write-cache:
        description: Write the registry build cache
        type: boolean
        default: false

jobs:
  build:
    name: ${{ matrix.base }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        base:
          - debian
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: linux/arm64,linux/arm/v7

      - name: Compute image name
        id: image
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          # ghcr.io requires lowercase repository names; owners can have capitals
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to the GitHub container registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build base image
        id: build-base
        uses: docker/build-push-action@v7.4.0
        # Push can be best-effort (PRs); fork tokens may lack package write access
        continue-on-error: ${{ inputs.best-effort-push }}
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ${{ matrix.base }}
          file: ./${{ matrix.base }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          target: base
          cache-from: type=registry,ref=${{ steps.image.outputs.image }}:cache-${{ matrix.base }}
          cache-to: ${{ inputs.write-cache && format('type=registry,ref={0}:cache-{1},mode=max', steps.image.outputs.image, matrix.base) || '' }}
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ matrix.base }}-${{ inputs.tag }}

      - name: Build ha-addon image
        id: build-ha-addon
        uses: docker/build-push-action@v7.4.0
        # Push can be best-effort (PRs); fork tokens may lack package write access
        continue-on-error: ${{ inputs.best-effort-push }}
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: ${{ matrix.base }}
          file: ./${{ matrix.base }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          target: ha-addon
          cache-from: type=registry,ref=${{ steps.image.outputs.image }}:cache-${{ matrix.base }}
          cache-to: ${{ inputs.write-cache && format('type=registry,ref={0}:cache-{1},mode=max', steps.image.outputs.image, matrix.base) || '' }}
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ matrix.base }}-ha-addon-${{ inputs.tag }}
