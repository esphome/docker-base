name: Build

on:
  workflow_run:
    workflows: [Release Drafter]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag suffix (defaults to the branch or tag name with / replaced by -)
        type: string
        required: false

permissions: {}

concurrency:
  # Manual runs get their own group so they never cancel (or are cancelled by) the main draft build
  group: build-${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      ref: ${{ steps.prepare.outputs.ref }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - name: Determine ref and tag
        id: prepare
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "workflow_run" ]; then
            ref="$RUN_SHA"
            tag="$RUN_SHA"
          else
            ref="$SHA"
            tag="$INPUT_TAG"
            if [ -z "$tag" ]; then
              tag="${REF_NAME//\//-}"
            fi

            # Docker tag charset; 112 max leaves room for the debian-ha-addon- prefix within Docker's 128 limit
            if [[ ! "$tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,111}$ ]]; then
              echo "::error::Invalid image tag '$tag'. Use 1-112 characters from A-Z a-z 0-9 _ . - and do not start with . or -. Set the tag input to override."
              exit 1
            fi
            if [[ "$tag" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+ ]]; then
              echo "::error::Refusing version-shaped tag '$tag'. Version tags are only applied by the Release workflow when a draft release is published."
              exit 1
            fi
            if [[ "$tag" =~ ^[0-9a-f]{40}$ && "$tag" != "$SHA" ]]; then
              echo "::error::Refusing tag '$tag': 40-character hex tags are reserved for the draft release builds."
              exit 1
            fi

            image="ghcr.io/${REPO,,}"
            {
              echo "Pushing:"
              echo "- \`$image:debian-$tag\`"
              echo "- \`$image:debian-ha-addon-$tag\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo "ref=$ref"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: prepare
    permissions:
      contents: read
      packages: write
    uses: $/.github/workflows/build-images.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      image: ghcr.io/${{ github.repository }}
      tag: ${{ needs.prepare.outputs.tag }}
      # Manual builds of arbitrary branches must not overwrite the main build cache
      write-cache: ${{ github.event_name == 'workflow_run' }}

  build-status:
    name: Update draft release
    needs: build
    if: ${{ !cancelled() && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.ESPHOME_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.ESPHOME_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Update build status in draft release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RESULT: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! id=$(gh api "repos/$REPO/releases?per_page=100" --jq '[.[] | select(.draft and .target_commitish == env.SHA)][0].id // empty'); then
            echo "::error::Failed to list releases."
            exit 1
          fi
          if [ -z "$id" ]; then
            msg="No draft release targets commit $SHA (superseded by a newer push), nothing to update."
            echo "::notice::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$RESULT" = "success" ]; then
            status=""
          else
            status="> [!CAUTION]
          > The image build for this draft failed (${RUN_URL}). Do not publish this release. Fix the build, or re-run the failed jobs."
          fi

          if ! release=$(gh api "repos/$REPO/releases/$id"); then
            echo "::error::Failed to fetch draft release $id."
            exit 1
          fi
          tag_name=$(jq -r '.tag_name' <<< "$release")
          if [[ "$tag_name" == untagged-* ]]; then
            echo "::error::Draft release $id has lost its tag ($tag_name). Re-run the Release Drafter workflow to restore it."
            exit 1
          fi
          body=$(jq -r '.body // ""' <<< "$release")
          start="<!-- build-status -->"
          end="<!-- /build-status -->"
          if [[ "$body" != *"$start"* || "$body" != *"$end"* ]]; then
            echo "::warning::Draft release $id has no build-status markers, leaving it unchanged."
            exit 0
          fi

          # Replace everything between the markers, keeping the markers so a re-run can update it again
          block="$start"$'\n'
          if [ -n "$status" ]; then
            block+="$status"$'\n'
          fi
          block+="$end"
          body="${body%%"$start"*}${block}${body#*"$end"}"

          # Re-send the draft's tag, name and target with the new body: a PATCH to a draft
          # without tag_name resets its tag to an untagged-* placeholder
          jq --arg body "$body" \
            '{tag_name, name, target_commitish, prerelease, draft: true, body: $body}' <<< "$release" \
            | gh api -X PATCH "repos/$REPO/releases/$id" --input - > /dev/null

          if [ "$RESULT" = "success" ]; then
            echo "Draft release $id: images built for $SHA, warning cleared." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Draft release $id: image build for $SHA did not succeed ($RESULT), failure notice added." >> "$GITHUB_STEP_SUMMARY"
          fi
